  <!-- ===== Meta Pixel + Advanced Matching (external_id, em, ph) ===== -->
  <script>
    // --- Helpers: получить параметр URL и собрать external_id ---
    function getParam(name, url){
      url = url || window.location.href;
      name = name.replace(/[[\]]/g, "\\$&");
      var re = new RegExp("[?&]"+name+"(=([^&#]*)|&|#|$)"), m = re.exec(url);
      if (!m) return null;
      return m[2] ? decodeURIComponent(m[2].replace(/\+/g, " ")) : '';
    }
    function collectExternalId(){
      var v = getParam('start') || getParam('clickid') || getParam('sub') || null;
      if (v) return v;
      try { return localStorage.getItem('external_id') || null; } catch(e){ return null; }
    }
    (function persistExternalId(){
      var eid = collectExternalId();
      if (eid) { try { localStorage.setItem('external_id', eid); } catch(e){} }
    })();

    // --- Bootstrap Meta Pixel ---
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

    // --- Advanced Matching (исправленный вариант) ---
    var AM = {
      external_id: collectExternalId() || undefined,
      em: 'email@email.com',   // тестовое значение, можно заменить на динамическое
      ph: '1234567890'         // тестовое значение, можно заменить на динамическое
    };
    fbq('init', '946062137525146', AM);
    fbq('track', 'PageView');
  </script>

  <!-- ===== Click Event Tracking (Lead) ===== -->
  <script>
    (function(){
      var btn = document.getElementById('telegram-button');
      if (!btn) return;

      function getParam(name, url){
        url = url || window.location.href;
        name = name.replace(/[[\]]/g, "\\$&");
        var re = new RegExp("[?&]"+name+"(=([^&#]*)|&|#|$)"), m = re.exec(url);
        if (!m) return null;
        return m[2] ? decodeURIComponent(m[2].replace(/\+/g, " ")) : '';
      }

      btn.addEventListener('click', function(e){
        e.preventDefault();
        var href = btn.getAttribute('href');

        // Отправим Lead и добавим полезные атрибуты
        try {
          fbq('track', 'Lead', {
            external_id: (function(){ try{return localStorage.getItem('external_id')||null;}catch(e){return null;} })(),
            utm_source: getParam('utm_source') || undefined,
            utm_medium: getParam('utm_medium') || undefined,
            utm_campaign: getParam('utm_campaign') || undefined
          });
        } catch(e) {}

        // Дадим пикселю время отправиться
        var jumped = false;
        var go = function(){ if (jumped) return; jumped = true; window.location.href = href; };
        setTimeout(go, 400);
        document.addEventListener('visibilitychange', function(){
          if (document.visibilityState === 'hidden') go();
        }, { once: true });
      });
    })();
  </script>
